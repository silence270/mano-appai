<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbf6f6">
<meta name="robots" content="noindex, nofollow">
<!--
  Griežta turinio politika. Svarbiausia eilutė — connect-src 'none':
  app'as fiziškai negali nusiųsti duomenų niekur, net jei kas nors į jį
  įterptų kodą. default-src 'none' reiškia, kad viskas, kas neišvardyta,
  uždrausta pagal nutylėjimą.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  media-src 'self' blob:;
  font-src 'self';
  connect-src 'none';
  worker-src 'self';
  manifest-src 'self';
  form-action 'none';
  base-uri 'none';
  frame-src 'none';
  object-src 'none';
">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lapas">
<title>Lapas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<noscript><div style="padding:40px 24px;text-align:center">Reikia JavaScript.</div></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
