<!DOCTYPE html>
<html lang="lt">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7d4f" />
  <title>Žaliasis dienoraštis</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Augalai" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>🌿 Žaliasis dienoraštis</h1>
    <span id="city-badge" class="city-badge" hidden></span>
  </header>

  <main id="view" class="view"><!-- pildoma JS --></main>

  <nav class="tabbar">
    <button class="tab" data-tab="today" aria-current="page">
      <span class="tab-ico">☀️</span><span class="tab-lbl">Šiandien</span>
    </button>
    <button class="tab" data-tab="plants">
      <span class="tab-ico">🪴</span><span class="tab-lbl">Augalai</span>
    </button>
    <button class="tab" data-tab="journal">
      <span class="tab-ico">📔</span><span class="tab-lbl">Dienoraštis</span>
    </button>
    <button class="tab" data-tab="settings">
      <span class="tab-ico">⚙️</span><span class="tab-lbl">Nustatymai</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
